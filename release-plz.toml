[workspace]
pr_draft = false
changelog_config = "cliff.toml"
pr_labels = ["release"]
git_release_name = "v{{ version }}"
publish = true
git_tag_enable = true
changelog_update = true

[[package]]
name = "native-executor"

[[package.files_to_update]]
path = "README.md"
search = 'native-executor = "[0-9]+\.[0-9]+(\.[0-9]+)?"'
replace = 'native-executor = "{{ version }}"'
