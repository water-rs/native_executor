name: CI

permissions:
  contents: read
  id-token: write

on:
  # Integration branches only: a topic branch that also has a pull request would
  # otherwise run the whole workflow twice for one commit, booting two hosted
  # emulators that contend for the same nested-KVM capacity.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  bump:
    # release-plz bump pull requests (`release-plz-*` heads) change only
    # versions and the changelog, so this job skips itself and every other
    # job skips through `needs: bump`.
    name: Not a release bump
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} is not a release bump"

  lint:
    name: Lint (${{ matrix.name }})
    needs: bump
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux lints the polyfill backend, macOS lints the Apple one. Without
          # both, half the crate is never seen by clippy.
          - name: Linux
            os: ubuntu-latest
            shared-key: ci-ubuntu
          - name: macOS
            os: macos-latest
            shared-key: ci-macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.shared-key }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  wasm:
    name: WASM
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - run: cargo build --target wasm32-unknown-unknown

  coverage:
    name: Coverage
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          fail_ci_if_error: true

  audit:
      name: Security Audit
      needs: bump
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: Swatinem/rust-cache@v2
          with:
            shared-key: ci-ubuntu
        - name: Generate Lockfile
          run: cargo generate-lockfile
        - uses: rustsec/audit-check@v2
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

  unused-deps:
    name: Unused Dependencies
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  feature-checks:
    name: Features
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-hack
      # Linux has no native backend, so `polyfill` is the backend there and the
      # crate rejects a build without it (`compile_error!` in src/lib.rs). That
      # combination is not a configuration to check, it is one the crate
      # declares unsupported; every other combination is still checked.
      - run: cargo hack check --each-feature --no-dev-deps --exclude-no-default-features
      - run: cargo hack check --feature-powerset --no-dev-deps --exclude-no-default-features

  test:
    name: Test
    needs: bump
    uses: ./.github/workflows/test.yml

  result:
    # The single check the `main` ruleset requires: it passes when every
    # job passed or was skipped (release-plz bump pull requests skip all).
    name: CI result
    if: always()
    needs: [bump, lint, wasm, coverage, audit, unused-deps, feature-checks, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "job results: $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::one or more jobs failed or were cancelled"
            exit 1
          fi
