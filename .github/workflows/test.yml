name: Test

on:
    workflow_call:

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-latest
                      script: cargo test --verbose
                    - name: macOS
                      os: macos-latest
                      script: bash scripts/test_macos.sh
                    - name: iOS (build only)
                      os: macos-latest
                      targets: aarch64-apple-ios,x86_64-apple-ios
                      script: |
                          cargo build --target aarch64-apple-ios
                          cargo build --target x86_64-apple-ios
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.targets }}
            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.name }}
            - run: ${{ matrix.script }}

    test-wasm:
        name: WASM
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            - run: bash scripts/test_wasm.sh

    test-android:
        name: Android
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: android-actions/setup-android@v3
            - uses: Swatinem/rust-cache@v2
            - name: Install NDK
              run: |
                  sdkmanager --install "ndk;26.1.10909125"
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
            # GitHub's Linux runners expose /dev/kvm only to root until a udev rule
            # opens it; without this the emulator silently runs with -accel off
            # (ProbeKVM: This user doesn't have permissions to use KVM) and boots in
            # minutes instead of seconds.
            - name: Enable KVM for the emulator
              run: |
                echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                sudo udevadm control --reload-rules
                sudo udevadm trigger --name-match=kvm
            - name: Run tests
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 31
                  arch: arm64-v8a
                  script: bash scripts/test_android.sh
